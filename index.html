<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ask Anything AI</title>
    <style>
        :root { --bg: #121212; --chat: #1e1e1e; --primary: #bb86fc; --text: #e0e0e0; --user: #3700b3; --bot: #2c2c2c; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        #app { width: 100%; max-width: 600px; display: flex; flex-direction: column; height: 100%; background: var(--bg); position: relative; }
        header { background: var(--chat); padding: 15px; text-align: center; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 1.1rem; color: var(--primary); }
        .settings-btn { background: none; border: none; color: var(--text); font-size: 1.2rem; cursor: pointer; }
        #chat { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 85%; padding: 10px 15px; border-radius: 15px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
        .user { align-self: flex-end; background: var(--user); color: white; border-bottom-right-radius: 2px; }
        .bot { align-self: flex-start; background: var(--bot); border: 1px solid #333; border-bottom-left-radius: 2px; }
        #input-area { background: var(--chat); padding: 10px; display: flex; gap: 10px; border-top: 1px solid #333; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: none; background: #2c2c2c; color: white; outline: none; }
        button.send-btn { padding: 10px 20px; border-radius: 25px; border: none; background: var(--primary); color: #000; font-weight: bold; cursor: pointer; }
        
        /* Modal Styles */
        #settings-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; flex-direction: column; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .modal-content { background: var(--chat); padding: 20px; border-radius: 10px; margin-top: 20px; }
        label { display: block; margin-bottom: 5px; color: var(--primary); font-size: 0.9rem; margin-top: 10px;}
        input, select { width: 100%; margin-bottom: 10px; padding: 10px; background: #2c2c2c; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .save-btn { flex: 2; background: var(--primary); color: black; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .fetch-btn { flex: 1; background: #444; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; }
        .close-btn { background: transparent; color: #ff4444; padding: 10px; border: none; width: 100%; cursor: pointer; margin-top: 10px; text-align: center;}
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1>Ask Anything</h1>
            <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
        </header>
        <div id="chat"></div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Type here..." autocomplete="off">
            <button class="send-btn" onclick="send()">Send</button>
        </div>

        <div id="settings-modal">
            <div class="modal-content">
                <h2 style="margin-top:0;">Settings</h2>
                
                <label>OpenRouter API Key</label>
                <input type="password" id="api-key-input" placeholder="sk-or-v1-...">
                
                <label>Select Free Model</label>
                <div style="display:flex; gap:5px;">
                    <select id="model-select" style="flex:3;"></select>
                    <button class="fetch-btn" onclick="fetchModels()" style="flex:1; margin:0;">🔄 Fetch</button>
                </div>
                <small style="color:#888; display:block; margin-bottom:10px;">Click Fetch to get latest free models.</small>

                <div class="btn-group">
                    <button class="save-btn" onclick="saveSettings()">Save & Close</button>
                </div>
                <button class="close-btn" onclick="toggleSettings()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let API_KEY = localStorage.getItem('or_api_key') || "";
        let MODEL_ID = localStorage.getItem('or_model_id') || "";
        let chatHistory = JSON.parse(localStorage.getItem('chat_history')) || [];

        const chatContainer = document.getElementById('chat');
        const userInput = document.getElementById('user-input');
        const modelSelect = document.getElementById('model-select');

        window.onload = () => {
            renderChat();
            if (!API_KEY) toggleSettings();
            if(modelSelect.options.length === 0) {
                let opt = document.createElement('option');
                opt.value = ""; opt.text = "Click Fetch to load models";
                modelSelect.add(opt);
            } else {
                modelSelect.value = MODEL_ID;
            }
        };

        async function fetchModels() {
            const btn = document.querySelector('.fetch-btn');
            btn.innerText = "Loading...";
            try {
                const res = await fetch('https://openrouter.ai/api/v1/models');
                const data = await res.json();
                const freeModels = data.data.filter(m => m.pricing.prompt === "0" && m.pricing.completion === "0");
                modelSelect.innerHTML = ""; 
                freeModels.sort((a, b) => a.name.localeCompare(b.name));
                freeModels.forEach(m => {
                    let opt = document.createElement('option');
                    opt.value = m.id;
                    opt.text = `${m.name} (${m.id})`;
                    modelSelect.add(opt);
                });
                btn.innerText = "✅ Done";
                setTimeout(() => btn.innerText = "🔄 Fetch", 2000);
            } catch (e) {
                alert("Failed to fetch models. Check internet.");
                btn.innerText = "🔄 Fetch";
            }
        }

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            if (modal.style.display === 'flex') {
                modal.style.display = 'none';
            } else {
                document.getElementById('api-key-input').value = API_KEY;
                if(MODEL_ID) modelSelect.value = MODEL_ID;
                modal.style.display = 'flex';
            }
        }

        function saveSettings() {
            API_KEY = document.getElementById('api-key-input').value.trim();
            MODEL_ID = modelSelect.value;
            if(!MODEL_ID) { alert("Please fetch and select a model first!"); return; }
            localStorage.setItem('or_api_key', API_KEY);
            localStorage.setItem('or_model_id', MODEL_ID);
            toggleSettings();
            addMsg(`Settings saved! Using: ${MODEL_ID}`, 'bot');
        }

        async function send() {
            const text = userInput.value.trim();
            if (!text) return;
            if (!API_KEY || !MODEL_ID) { toggleSettings(); return; }

            addMsg(text, 'user');
            userInput.value = '';
            chatHistory.push({ role: "user", content: text });
            saveHistory();

            try {
                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/json",
                        "HTTP-Referer": window.location.href,
                        "X-Title": "Ask Anything App"
                    },
                    body: JSON.stringify({ "model": MODEL_ID, "messages": chatHistory })
                });

                const data = await response.json();
                if (data.error) {
                    addMsg(`❌ Error: ${data.error.message}`, 'bot');
                } else if (data.choices && data.choices.length > 0) {
                    const reply = data.choices[0].message.content;
                    addMsg(reply, 'bot');
                    chatHistory.push({ role: "assistant", content: reply });
                    saveHistory();
                }
            } catch (err) {
                addMsg(`❌ Network Error: ${err.message}`, 'bot');
            }
        }

        function addMsg(text, sender) {
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.innerText = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function renderChat() {
            chatContainer.innerHTML = '';
            if(chatHistory.length === 0) addMsg("Hi! Click Settings ⚙️ -> Fetch Models to start.", 'bot');
            else chatHistory.forEach(msg => addMsg(msg.content, msg.role === 'user' ? 'user' : 'bot'));
        }

        function saveHistory() {
            if(chatHistory.length > 20) chatHistory = chatHistory.slice(-20);
            localStorage.setItem('chat_history', JSON.stringify(chatHistory));
        }

        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') send(); });
    </script>
</body>
</html>
